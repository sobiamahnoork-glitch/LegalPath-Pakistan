name: LegalPath CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: node --check server/index.js
      - run: node --check server/agents.js
      - run: node --check server/ai.js
      - run: node --check server/data.js
      - run: node --check server/supabase.js
